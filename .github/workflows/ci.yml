name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy public envs so `next build` can prerender without real secrets.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  # ── Static checks + unit/integration + build (SDLC §3 steps 1-4, 8) ───────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # Build first: tests/security/bundle.test.ts scans the built .next output (S-11).
      - name: Build
        run: pnpm build

      - name: Unit + integration tests (coverage gates)
        run: pnpm -r test

      - name: Scan client bundle for leaked secrets (S-11)
        run: node scripts/scan-bundle-secrets.mjs apps/web/.next

      - name: Scan desktop webview bundle for leaked secrets (D-01)
        run: node scripts/scan-bundle-secrets.mjs apps/desktop/dist

  # ── Vulnerability testing (docs/08-SECURITY.md §6) ────────────────────────────
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Semgrep results → Security → Code scanning
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: this job never runs pnpm install, so there is no store to save.

      - name: Security guard — README rules + Tauri hardening (G-01..G-13)
        run: node scripts/security-guard.mjs

      - name: Security guard self-test (each check catches a planted violation)
        run: node --test scripts/security-guard.test.mjs

      - name: npm dependency audit (A-01, high and above)
        run: pnpm audit --audit-level=high

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit (A-02)
        working-directory: apps/desktop/src-tauri
        run: cargo audit

      # Community rules for TS/React/Next/Rust/secrets. Blocking: the first baseline
      # (2026-11-25, 123 rules, 294 files) had 0 findings. Results also go to the Security tab.
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan \
            --config p/typescript --config p/react --config p/nextjs \
            --config p/rust --config p/secrets \
            --exclude node_modules --exclude .next --exclude dist --exclude target \
            --sarif --output semgrep.sarif --metrics off --error

      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── Database: schema reproduces from scratch + lint + RLS suite (SDLC §3 5-6) ─
  # Enabled from phase P2 once supabase/migrations exist.
  database:
    runs-on: ubuntu-latest
    # (A job-level `if: hashFiles(...)` is invalid in GitHub Actions — hashFiles only
    # works in step context — and made the whole workflow fail with zero jobs.)
    env:
      RUN_RLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Pinned to the CLI in pnpm-lock.yaml (devDependency `supabase`). `latest` made an
      # anonymous GitHub API call per run and failed on "rate limit exceeded".
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Start local Supabase
        run: supabase start
      - name: Reset (reproduce schema + seed from scratch)
        run: supabase db reset
      - name: Lint schema
        run: supabase db lint
      - name: Install
        run: pnpm install --frozen-lockfile
      # The workflow-level env points at a dummy project for `next build`; the RLS suite
      # must hit the local stack started above, so pass its real URL/keys (local demo
      # values printed by `supabase status`, not secrets) inline — inline wins over `env:`.
      - name: RLS suite (S-01..S-12)
        run: |
          eval "$(supabase status -o env)"
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::supabase status -o env did not print API_URL / ANON_KEY / SERVICE_ROLE_KEY"
            exit 1
          fi
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm --filter @extramile/web test:rls

  # ── E2E against a preview deploy (SDLC §3 step 7) ─────────────────────────────
  # Enabled from phase P3+. Requires a preview URL secret.
  e2e:
    runs-on: ubuntu-latest
    if: ${{ false }} # TODO: enable once Playwright specs + preview URL are wired (P3)
    steps:
      - uses: actions/checkout@v4
      - run: echo "playwright test against preview"
