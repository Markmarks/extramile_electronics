# Supabase local config. One project per environment — never shared (docs/03-SDLC.md §1).
project_id = "extramile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.product-images]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif"]

[storage.buckets.invoices]
public = false

[storage.buckets.warranty-cards]
public = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:1421/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Provider secrets come from env (never committed) — docs/05-OAUTH.md §9.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[edge_runtime]
enabled = true

# Paystack calls the webhook with no JWT — auth is the HMAC signature instead.
[functions.paystack-webhook]
verify_jwt = false

# Reconciler is invoked by pg_cron (service role); it does its own auth checks.
[functions.reconcile-payments]
verify_jwt = false

# admin-actions requires a signed-in caller; the function re-checks staff role.
[functions.admin-actions]
verify_jwt = true
